<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

  <title>Student Form</title>

  <style>
    .form-box {
      border: 2px solid black;
      padding: 25px;
      border-radius: 10px;
      width: 420px;
      margin: auto;
      background-color: #f9f9f9;
    }
  </style>
</head>

<body>
  <div class="container mt-4">
    <!-- Student Form Card Box Structure -->
    <form class="form-box mb-4" action="#">
      <div class="text-center mb-3">
        <h3>Student Form</h3>
        <span id="error" style="color: red; font-weight: bold;"></span>
      </div>

      <div class="mb-2">
        <label class="form-label fw-bold">Id:</label>
        <input type="number" id="id" class="form-control" />
      </div>

      <div class="row mb-2">
        <div class="col">
          <label class="form-label fw-bold">First Name:</label>
          <input type="text" id="firstName" class="form-control" />
        </div>
        <div class="col">
          <label class="form-label fw-bold">Last Name:</label>
          <input type="text" id="lastName" class="form-control" />
        </div>
      </div>

      <div class="mb-2">
        <label class="form-label fw-bold">Date of Birth:</label>
        <input type="date" id="dob" class="form-control" />
      </div>

      <div class="mb-2">
        <label class="form-label fw-bold">Gender:</label><br />
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="genderMale" value="Male" />
          <label class="form-check-label" for="genderMale">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="Female" />
          <label class="form-check-label" for="genderFemale">Female</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="genderOther" value="Other" />
          <label class="form-check-label" for="genderOther">Other</label>
        </div>
      </div>

      <div class="row mb-2">
        <div class="col">
          <label class="form-label fw-bold">Age:</label>
          <input type="number" id="age" class="form-control" />
        </div>
        <div class="col">
          <label class="form-label fw-bold">Email:</label>
          <input type="email" id="email" class="form-control" />
        </div>
      </div>

      <div class="row mb-2">
        <div class="col">
          <label class="form-label fw-bold">Phone:</label>
          <input type="number" id="phone" class="form-control" />
        </div>
        <div class="col">
          <label class="form-label fw-bold">Address:</label>
          <input type="text" id="address" class="form-control" />
        </div>
      </div>

      <div class="row mb-2">
        <div class="col">
          <label class="form-label fw-bold">City:</label>
          <select id="city" class="form-select">
            <option value="">-- Select City --</option>
            <option value="Delhi">Delhi</option>
            <option value="Noida">Noida</option>
            <option value="Ghaziabad">Ghaziabad</option>
          </select>
        </div>
        <div class="col">
          <label class="form-label fw-bold">State:</label>
          <select id="state" class="form-select">
            <option value="">-- Select State --</option>
            <option value="Delhi">Delhi</option>
            <option value="UP">Uttar Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col">
          <label class="form-label fw-bold">Course:</label>
          <select id="course" class="form-select">
            <option value="">-- Select Course --</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="IIT">IIT</option>
          </select>
        </div>
        <div class="col">
          <label class="form-label fw-bold" for="admissionDate">Admission Date:</label>
          <input type="date" id="admissionDate" class="form-control" />
          <span id="dateError" style="color: red;"></span>
        </div>
      </div>

      <div class="text-center">
        <button type="button" id="submitBtn" onclick="createStudent(event)" class="btn btn-primary w-25">Submit</button>
        <button type="button" id="updateBtn" onclick="updateStudent(event)" class="btn btn-success w-25" style="display: none;">Update</button>
      </div>
    </form>

    <!-- Student Table Grid Space -->
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <div class="row align-items-center mb-3">
          <div class="col-md-6">
            <h4 class="m-0">Student List</h4>
            <small class="text-muted">
              Total Students: <span id="studentCount">0</span>
            </small>
          </div>
          <div class="col-md-6">
            <div class="input-group">
              <input type="search" id="studentSearch" class="form-control" placeholder="Search by name or ID..." oninput="searchStudDeBound()" />
              <button class="btn btn-primary" type="button" id="btnSearch" onclick="searchStudentAPI()">
                Search
              </button>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead class="table-dark">
              <tr>
                <th scope="col">StudentId</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">DOB</th>
                <th scope="col">Gender</th>
                <th scope="col">Age</th>
                <th scope="col">Email</th>
                <th scope="col">Phone</th>
                <th scope="col">Address</th>
                <th scope="col">City</th>
                <th scope="col">State</th>
                <th scope="col">Course</th>
                <th scope="col">Admission Date</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <!-- Dynamically populated rows go here -->
            </tbody>
          </table>
        </div>

        <!-- Pagination Controls Interface -->
        <nav aria-label="Page navigation" class="mt-4">
          <ul class="pagination justify-content-center">
            <li class="page-item" id="prevPageItem">
              <button type="button" class="page-link" onclick="previousPage()">Previous</button>
            </li>
            <li class="page-item disabled">
              <span class="page-link text-dark">
                Page <span id="currentPageNum">1</span> of <span id="totalPages">1</span>
              </span>
            </li>
            <li class="page-item" id="nextPageItem">
              <button type="button" class="page-link" onclick="nextPage()">Next</button>
            </li>
          </ul>
        </nav>

      </div>
    </div>
  </div>

  <script>
    let StudentList = []; // Holds all structural student references retrieved or filtered
    let displayedList = [];      // Current dataset scoped directly to rendering updates
    const apiUrl = 'https://localhost:7222/api/Student';
    
    // Pagination Configuration
    let currentPage = 1;
    let pageSize = 5; // Shows 5 items per table page view context
    let totalPages = 1;
    let searchTimer;

    window.onload = function() {
      getStudents();
    };

    // --- FETCH READ ALL ---
    async function getStudents() {
      try {
        // Attempts loading server records natively using page targets if available, 
        // fallback engine automatically handles basic global object lists safely.
        const response = await fetch(`${apiUrl}?currentPage=${currentPage}&pageSize=${pageSize}`, {
          method: 'GET',
          headers: { 'accept': '*/*' }
        });
        
        if (response.ok) {
          const rawData = await response.json();
          
          // Checks if server output returns array directly or an object wrapper container
          if (Array.isArray(rawData)) {
            StudentList = rawData;
          } else if (rawData.students) {
            StudentList = rawData.students;
          } else {
            StudentList = rawData; 
          }
          
          document.getElementById("studentCount").textContent = StudentList.length;
          
          // Trigger display initialization
          runSearchAndPaginationFilter();
        } else {
          console.error("Failed to fetch students. Status Code:", response.status);
        }
      } catch (error) {
        console.error("Network Exception inside getStudents():", error);
      }
    }

    // --- PIPELINE FILTER & PAGINATION CALCULATOR ---
    function runSearchAndPaginationFilter() {
      const query = document.getElementById("studentSearch").value.toLowerCase().trim();

      // Step 1: Filter against the full data array based on Search input
      let filteredData = StudentList;
      if (query !== "") {
        filteredData = StudentList.filter(student => {
          const fName = (student.firstName || student.FirstName || '').toLowerCase();
          const lName = (student.lastName || student.LastName || '').toLowerCase();
          const sId = (student.studentID !== undefined ? student.studentID : student.StudentID || '').toString();
          return fName.includes(query) || lName.includes(query) || sId.includes(query);
        });
      }

      // Step 2: Calculate math constraints dynamically based on items array length
      totalPages = Math.ceil(filteredData.length / pageSize) || 1;
      
      // Protect pagination boundaries from shifting dataset sizes
      if (currentPage > totalPages) {
        currentPage = totalPages;
      }
      if (currentPage < 1) {
        currentPage = 1;
      }

      // Step 3: Slice the display tracking list array to match current page constraints
      const startIndex = (currentPage - 1) * pageSize;
      const endIndex = startIndex + pageSize;
      displayedList = filteredData.slice(startIndex, endIndex);

      // Step 4: Update presentation layouts
      displayStudents(displayedList);
      updatePaginationControls();
    }

    // --- DISPLAY TABLE BUILDER ---
    function displayStudents(students) {
      const tableBody = document.getElementById('studentTableBody');
      tableBody.innerHTML = ''; 

      if (students.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="14" class="text-muted p-3">No student records found to display.</td></tr>`;
        return;
      }

      students.forEach(student => {
        const currentId = student.studentID !== undefined ? student.studentID : student.StudentID;
        const fName = student.firstName || student.FirstName || '';
        const lName = student.lastName || student.LastName || '';
        const dob = student.dateofbirth || student.Dateofbirth || '';
        const gender = student.gender || student.Gender || '';
        const age = student.age !== undefined ? student.age : student.Age;
        const email = student.email || student.Email || '';
        const phone = student.phone || student.Phone || '';
        const address = student.address || student.Address || '';
        const city = student.city || student.City || '';
        const state = student.state || student.State || '';
        const course = student.course || student.Course || '';
        const admiDate = student.admiDate || student.AdmiDate || '';

        const row = `
          <tr>
            <td>${currentId}</td>
            <td>${fName}</td>
            <td>${lName}</td>
            <td>${dob}</td>
            <td>${gender}</td>
            <td>${age}</td>
            <td>${email}</td>
            <td>${phone}</td>
            <td>${address}</td>
            <td>${city}</td>
            <td>${state}</td>
            <td>${course}</td>
            <td>${admiDate}</td>
            <td>
              <div class="d-flex gap-1 justify-content-center">
                <button type="button" onclick="populateForm('${currentId}')" class="btn btn-primary btn-sm">Edit</button>
                <button type="button" onclick="handleDelete('${currentId}')" class="btn btn-danger btn-sm">Delete</button>
              </div>
            </td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    // --- PAGINATION RENDERING STATE LOGIC ---
    function updatePaginationControls() {
      document.getElementById("currentPageNum").textContent = currentPage;
      document.getElementById("totalPages").textContent = totalPages;

      const prevItem = document.getElementById("prevPageItem");
      const nextItem = document.getElementById("nextPageItem");

      // Handle Previous Button State
      if (currentPage <= 1) {
        prevItem.classList.add("disabled");
      } else {
        prevItem.classList.remove("disabled");
      }

      // Handle Next Button State
      if (currentPage >= totalPages) {
        nextItem.classList.add("disabled");
      } else {
        nextItem.classList.remove("disabled");
      }
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        runSearchAndPaginationFilter();
      }
    }

    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        runSearchAndPaginationFilter();
      }
    }

    // --- SEARCH LOGIC CONTROLS ---
    function searchStudDeBound() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentPage = 1; // Shifts users naturally to page 1 during new text changes
        runSearchAndPaginationFilter();
      }, 300); 
    }

    function searchStudentAPI() {
      currentPage = 1;
      runSearchAndPaginationFilter();
    }

    // --- CREATE / POST ---
    async function createStudent(event) {
      event.preventDefault();

      const studentData = getFormData();
      if (!studentData) return; 

      const isExisting = masterStudentList.some(x => {
        const checkingId = x.studentID !== undefined ? x.studentID : x.StudentID;
        return checkingId == studentData.StudentID;
      });
      
      if (isExisting) {
        document.getElementById("error").innerHTML = "A student with this ID already exists. Use Update workflow.";
        return;
      }

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(studentData)
        });

        if (response.ok) {
          alert("Student Created Successfully!");
          document.querySelector("form").reset();
          getStudents();
        } else {
          const errorMsg = await response.text();
          alert("Server Error (" + response.status + "): " + errorMsg);
        }
      } catch (e) {
        console.error("Exception thrown during creation processing:", e);
      }
    }

    // --- EDIT VIEW FORM BINDING ---
    function populateForm(studentID) {
      const student = masterStudentList.find(x => {
        const idToCheck = x.studentID !== undefined ? x.studentID : x.StudentID;
        return idToCheck == studentID;
      });
      
      if (!student) return;

      document.getElementById("id").value = student.studentID !== undefined ? student.studentID : student.StudentID;
      document.getElementById("firstName").value = student.firstName || student.FirstName || '';
      document.getElementById("lastName").value = student.lastName || student.LastName || '';
      document.getElementById("dob").value = student.dateofbirth || student.Dateofbirth || '';
      document.getElementById("age").value = student.age !== undefined ? student.age : student.Age;
      document.getElementById("email").value = student.email || student.Email || '';
      document.getElementById("phone").value = student.phone || student.Phone || '';
      document.getElementById("address").value = student.address || student.Address || '';
      document.getElementById("city").value = student.city || student.City || '';
      document.getElementById("state").value = student.state || student.State || '';
      document.getElementById("course").value = student.course || student.Course || '';
      document.getElementById("admissionDate").value = student.admiDate || student.AdmiDate || '';

      const targetGender = student.gender || student.Gender || '';
      const genderRadios = document.getElementsByName("gender");
      for (let i = 0; i < genderRadios.length; i++) {
        genderRadios[i].checked = (genderRadios[i].value === targetGender);
      }

      document.getElementById("submitBtn").style.display = "none";    
      document.getElementById("updateBtn").style.display = "inline-block"; 
      document.getElementById("id").readOnly = true;
      document.getElementById("error").innerHTML = "";
    }

    // --- UPDATE / PUT ---
    async function updateStudent(event) {
      event.preventDefault(); 

      const id = document.getElementById("id").value;
      const studentData = getFormData();
      if (!studentData) return;

      try {
        const response = await fetch(`${apiUrl}/${id}`, { 
          method: 'PUT',
          headers: {
            'accept': '*/*',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(studentData)
        });

        if (response.ok) {
          alert("Student Updated Successfully!");

          document.getElementById("submitBtn").style.display = "inline-block";
          document.getElementById("updateBtn").style.display = "none";
          document.getElementById("id").readOnly = false;

          document.querySelector("form").reset();
          getStudents();
        } else {
          alert("Update call failed. Server Response Status: " + response.status);
        }
      } catch (err) {
        console.error("PUT Request Exception:", err);
      }
    }

    // --- DELETE ---
    async function handleDelete(studentID) {
      if (confirm("Are you sure you want to delete this student record permanently?")) {
        try {
          const response = await fetch(`${apiUrl}/${studentID}`, {
            method: 'DELETE',
            headers: { 'accept': '*/*' }
          });

          if (response.ok) {
            alert("Student deleted successfully!");
            getStudents(); 
          } else {
            alert("Delete routine rejected by server. Status Code: " + response.status);
          }
        } catch (err) {
          console.error("Delete Endpoint Interface Exception:", err);
        }
      }
    }

    // --- UI FORM EXTRACTION & VALIDATION HELPER ---
    function getFormData() {
      const id = document.getElementById("id").value.trim();
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const dob = document.getElementById("dob").value;
      const age = document.getElementById("age").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const city = document.getElementById("city").value;
      const state = document.getElementById("state").value;
      const course = document.getElementById("course").value;
      const admissionDate = document.getElementById("admissionDate").value;

      let gender = "";
      const genderRes = document.getElementsByName("gender");
      for (let i = 0; i < genderRes.length; i++) {
        if (genderRes[i].checked) {
          gender = genderRes[i].value;
          break;
        }
      }

      const errorSpan = document.getElementById("error");
      if (!id) { errorSpan.innerHTML = "Please enter student id"; return null; }
      if (!firstName) { errorSpan.innerHTML = "Please enter first name"; return null; }
      if (!lastName) { errorSpan.innerHTML = "Please enter last name"; return null; }
      if (!dob) { errorSpan.innerHTML = "Please enter DOB"; return null; }
      if (!gender) { errorSpan.innerHTML = "Please select gender"; return null; }
      if (!age) { errorSpan.innerHTML = "Please enter age"; return null; }
      if (!email) { errorSpan.innerHTML = "Please enter email"; return null; }
      if (!phone) { errorSpan.innerHTML = "Please enter phone number"; return null; }
      if (!address) { errorSpan.innerHTML = "Please enter address"; return null; }
      if (!city) { errorSpan.innerHTML = "Please select city"; return null; }
      if (!state) { errorSpan.innerHTML = "Please select state"; return null; }
      if (!course) { errorSpan.innerHTML = "Please select course"; return null; }
      if (!admissionDate) { errorSpan.innerHTML = "Please enter admission date"; return null; }

      errorSpan.innerHTML = ""; 
      
      return {
        StudentID: parseInt(id),
        FirstName: firstName,
        LastName: lastName,
        Gender: gender,
        Dateofbirth: dob,
        Age: parseInt(age),
        Email: email,
        Phone: phone,
        Address: address,
        City: city,
        State: state,
        Course: course,
        AdmiDate: admissionDate
      };
    }
  </script>
</body>

</html>
